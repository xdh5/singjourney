[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singjourney-api"
version = "0.2.0"
description = "Backend API for SingJourney voice practice"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "mido==1.3.3",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
