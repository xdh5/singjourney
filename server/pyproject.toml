[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singjourney-api"
version = "0.1.0"
description = "Backend API for SingJourney voice practice"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "boto3==1.43.51",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
