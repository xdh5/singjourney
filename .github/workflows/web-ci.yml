name: Web 构建与发布

# 仅在明确需要发布 Web 时手工触发；不会构建其他客户端。
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取源码
        uses: actions/checkout@v6
      - name: 配置 Docker 构建器
        uses: docker/setup-buildx-action@v3
      - name: 从源码构建 Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          target: web-artifact
          build-args: |
            CLIENT_BUILD_SCRIPT=build:client:web
            CLIENT_RELEASE_COMPONENT=web
          outputs: type=local,dest=client/dist/h5
      - name: 直接发布静态资源到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '缺少 Cloudflare 发布令牌'; exit 1; }
          docker build --target web -f docker/Dockerfile.cloudflare -t singjourney-web .
          docker run --rm -e CLOUDFLARE_API_TOKEN singjourney-web
