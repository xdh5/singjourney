name: Web 发布快照

# Web 仅由人工触发，日常客户端修改只构建微信小程序。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
      - name: 发布仓库中已验收的 Web 快照和接口
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '缺少 Cloudflare 发布令牌'; exit 1; }
          docker build -f docker/Dockerfile.cloudflare -t singjourney-cloudflare .
          docker run --rm -e CLOUDFLARE_API_TOKEN singjourney-cloudflare npx wrangler deploy
