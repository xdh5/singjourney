name: Client Release

on:
  push:
    tags:
      - "wx-pitch-v*"
      - "wx-practice-v*"
      - "ios-v*"
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve tagged client release
        id: release
        shell: bash
        run: |
          component="${GITHUB_REF_NAME%%-v*}"
          node scripts/release-version.mjs github-output "$component" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          case "$component" in
            wx-pitch)
              echo "build_script=build:client:wx-pitch" >> "$GITHUB_OUTPUT"
              echo "artifact_target=wx-pitch-artifact" >> "$GITHUB_OUTPUT"
              ;;
            wx-practice)
              echo "build_script=build:client:wx-practice" >> "$GITHUB_OUTPUT"
              echo "artifact_target=wx-practice-artifact" >> "$GITHUB_OUTPUT"
              ;;
            ios)
              echo "build_script=build:client:ios" >> "$GITHUB_OUTPUT"
              echo "artifact_target=ios-artifact" >> "$GITHUB_OUTPUT"
              ;;
            android)
              echo "build_script=build:client:android" >> "$GITHUB_OUTPUT"
              echo "artifact_target=android-artifact" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported client release component: $component" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Type-check, test, and build tagged client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          target: ${{ steps.release.outputs.artifact_target }}
          push: false
          build-args: |
            CLIENT_BUILD_SCRIPT=${{ steps.release.outputs.build_script }}
            CLIENT_RUN_CHECKS=true
            CLIENT_RELEASE_COMPONENT=${{ steps.release.outputs.component }}
            CLIENT_RELEASE_TAG=${{ github.ref_name }}
            CLIENT_RELEASE_VERSION=${{ steps.release.outputs.version }}
            PITCH_MINI_PROGRAM_APP_ID=${{ vars.SINGJOURNEY_PITCH_MINI_PROGRAM_APP_ID }}
            PRACTICE_MINI_PROGRAM_APP_ID=${{ vars.SINGJOURNEY_PRACTICE_MINI_PROGRAM_APP_ID }}
          outputs: type=local,dest=release-artifact
          cache-from: type=gha,scope=client-${{ steps.release.outputs.component }}
          cache-to: type=gha,mode=max,scope=client-${{ steps.release.outputs.component }}

      - name: Write release metadata
        shell: bash
        run: |
          cat > release-artifact/release.json <<EOF
          {
            "platform": "${{ steps.release.outputs.component }}",
            "version": "${{ steps.release.outputs.version }}",
            "versionCode": ${{ steps.release.outputs.version_code }},
            "gitTag": "${{ github.ref_name }}",
            "gitSha": "${{ github.sha }}"
          }
          EOF

      - name: Upload tagged client artifact
        uses: actions/upload-artifact@v4
        with:
          name: singjourney-${{ steps.release.outputs.component }}-${{ steps.release.outputs.version }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 14
