name: Cloudflare 服务端发布

on:
  pull_request:
    paths: ["server/**", "cloudflare/**", "docker/Dockerfile.cloudflare*", ".github/workflows/server-ci.yml"]
  push:
    branches: [main]
    paths: ["server/**", "cloudflare/**", "docker/Dockerfile.cloudflare*", ".github/workflows/server-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
      - name: 使用 Docker 构建
        run: |
          docker build -f docker/Dockerfile.cloudflare -t singjourney-cloudflare .
          docker run --rm singjourney-cloudflare
      - name: 发布到 Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '缺少 Cloudflare 发布令牌'; exit 1; }
          docker run --rm -e CLOUDFLARE_API_TOKEN singjourney-cloudflare npx wrangler deploy
