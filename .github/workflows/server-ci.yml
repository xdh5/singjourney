name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - "Dockerfile.server"
      - "compose.server.yml"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [main]
    tags:
      - "server-v*"
    paths:
      - "server/**"
      - "Dockerfile.server"
      - "compose.server.yml"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shengji_ci
          POSTGRES_USER: shengji_ci
          POSTGRES_PASSWORD: shengji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shengji_ci -d shengji_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SHENGJI_ENVIRONMENT: test
      SHENGJI_DATABASE_URL: postgresql+psycopg://shengji_ci:shengji_ci@127.0.0.1:5432/shengji_ci
      SHENGJI_STORAGE_BACKEND: local
      SHENGJI_STORAGE_ROOT: /tmp/shengji-media
      SHENGJI_PUBLIC_API_BASE_URL: https://example.test/api/v1
      SHENGJI_PUBLIC_SHARE_BASE_URL: https://example.test
      SHENGJI_PUBLIC_MEDIA_BASE_URL: https://example.test/api/v1
      SHENGJI_CORS_ORIGINS: https://example.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Server release version
        shell: bash
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          node ../scripts/release-version.mjs resolve server "$tag"
        working-directory: server

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install server dependencies
        working-directory: server
        run: python -m pip install --editable ".[dev]"

      - name: Compile Python sources
        working-directory: server
        run: python -m compileall -q app migrations tests

      - name: Apply database migrations
        working-directory: server
        run: alembic upgrade head

      - name: Run server tests
        working-directory: server
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production server image
        run: docker build --file Dockerfile.server --tag voicetrace-server:ci .

  deploy:
    needs: [verify, image]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/server-v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '47.116.4.25' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/voicetrace' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.ECS_SSH_KEY }}
      SHENGJI_DATABASE_PASSWORD: ${{ secrets.SHENGJI_DATABASE_PASSWORD }}
      SHENGJI_R2_ACCOUNT_ID: ${{ vars.SHENGJI_R2_ACCOUNT_ID }}
      SHENGJI_R2_ACCESS_KEY_ID: ${{ secrets.SHENGJI_R2_ACCESS_KEY_ID }}
      SHENGJI_R2_SECRET_ACCESS_KEY: ${{ secrets.SHENGJI_R2_SECRET_ACCESS_KEY }}
      SHENGJI_R2_BUCKET_NAME: ${{ vars.SHENGJI_R2_BUCKET_NAME || 'shengji-share-audio' }}
      SHENGJI_PUBLIC_API_BASE_URL: ${{ vars.SHENGJI_PUBLIC_API_BASE_URL || 'https://tone.cyberlab.bond/api/v1' }}
      SHENGJI_PUBLIC_SHARE_BASE_URL: ${{ vars.SHENGJI_PUBLIC_SHARE_BASE_URL || 'https://tone.cyberlab.bond' }}
      SHENGJI_PUBLIC_MEDIA_BASE_URL: ${{ vars.SHENGJI_PUBLIC_MEDIA_BASE_URL || 'https://tone.cyberlab.bond/api/v1' }}
      SHENGJI_CORS_ORIGINS: ${{ vars.SHENGJI_CORS_ORIGINS || 'https://tone.cyberlab.bond' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing Actions variable: DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "Missing Actions secret: DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SHENGJI_DATABASE_PASSWORD" || { echo "Missing Actions secret: SHENGJI_DATABASE_PASSWORD"; exit 1; }
          test -n "$SHENGJI_R2_ACCOUNT_ID" || { echo "Missing Actions variable: SHENGJI_R2_ACCOUNT_ID"; exit 1; }
          test -n "$SHENGJI_R2_ACCESS_KEY_ID" || { echo "Missing Actions secret: SHENGJI_R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$SHENGJI_R2_SECRET_ACCESS_KEY" || { echo "Missing Actions secret: SHENGJI_R2_SECRET_ACCESS_KEY"; exit 1; }

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Package server release
        run: tar -czf server-release.tar.gz Dockerfile.server compose.server.yml server

      - name: Create protected server environment
        run: |
          umask 077
          encoded_database_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SHENGJI_DATABASE_PASSWORD"], safe=""))')"
          {
            printf 'SHENGJI_ENVIRONMENT=production\n'
            printf 'SHENGJI_DATABASE_PASSWORD=%s\n' "$SHENGJI_DATABASE_PASSWORD"
            printf 'SHENGJI_DATABASE_URL=postgresql+psycopg://shengji:%s@db:5432/shengji\n' "$encoded_database_password"
            printf 'SHENGJI_STORAGE_BACKEND=cloudflare_r2\n'
            printf 'SHENGJI_STORAGE_ROOT=/data/media\n'
            printf 'SHENGJI_R2_ACCOUNT_ID=%s\n' "$SHENGJI_R2_ACCOUNT_ID"
            printf 'SHENGJI_R2_ACCESS_KEY_ID=%s\n' "$SHENGJI_R2_ACCESS_KEY_ID"
            printf 'SHENGJI_R2_SECRET_ACCESS_KEY=%s\n' "$SHENGJI_R2_SECRET_ACCESS_KEY"
            printf 'SHENGJI_R2_BUCKET_NAME=%s\n' "$SHENGJI_R2_BUCKET_NAME"
            printf 'SHENGJI_PUBLIC_API_BASE_URL=%s\n' "$SHENGJI_PUBLIC_API_BASE_URL"
            printf 'SHENGJI_PUBLIC_SHARE_BASE_URL=%s\n' "$SHENGJI_PUBLIC_SHARE_BASE_URL"
            printf 'SHENGJI_PUBLIC_MEDIA_BASE_URL=%s\n' "$SHENGJI_PUBLIC_MEDIA_BASE_URL"
            printf 'SHENGJI_CORS_ORIGINS=%s\n' "$SHENGJI_CORS_ORIGINS"
            printf 'SHENGJI_DATA_PATH=%s/data\n' "$DEPLOY_PATH"
          } > server-deploy.env

      - name: Upload and activate server release
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key server-release.tar.gz server-deploy.env \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_root="$DEPLOY_PATH/server/releases"
          release_path="$release_root/$RELEASE_SHA"
          current_path="$DEPLOY_PATH/server/current"
          environment_path="$DEPLOY_PATH/server/server.env"
          mkdir -p "$release_path" "$DEPLOY_PATH/data"
          tar -xzf /tmp/server-release.tar.gz -C "$release_path"
          rm -f /tmp/server-release.tar.gz
          install -m 600 /tmp/server-deploy.env "$environment_path"
          rm -f /tmp/server-deploy.env
          if [ -e "$current_path" ] && [ ! -L "$current_path" ]; then
            mv "$current_path" "$DEPLOY_PATH/server/pre-cd-$(date +%Y%m%d%H%M%S)"
          fi
          ln -sfn "$release_path" "$current_path"
          cd "$current_path"
          docker compose --project-name voicetrace --env-file "$environment_path" \
            -f compose.server.yml up -d --build --remove-orphans
          for attempt in $(seq 1 18); do
            if docker compose --project-name voicetrace --env-file "$environment_path" \
              -f compose.server.yml exec -T api python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"; then
              exit 0
            fi
            sleep 5
          done
          docker compose --project-name voicetrace --env-file "$environment_path" \
            -f compose.server.yml logs --tail=100 api
          exit 1
          REMOTE
