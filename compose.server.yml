x-server-environment: &server-environment
  SHENGJI_DATABASE_URL: ${SHENGJI_DATABASE_URL:-postgresql+psycopg://shengji:shengji-local-only@db:5432/shengji}
  SHENGJI_STORAGE_ROOT: ${SHENGJI_STORAGE_ROOT:-/data/media}
  SHENGJI_STORAGE_BACKEND: ${SHENGJI_STORAGE_BACKEND:-local}
  SHENGJI_R2_ACCOUNT_ID: ${SHENGJI_R2_ACCOUNT_ID:-}
  SHENGJI_R2_ACCESS_KEY_ID: ${SHENGJI_R2_ACCESS_KEY_ID:-}
  SHENGJI_R2_SECRET_ACCESS_KEY: ${SHENGJI_R2_SECRET_ACCESS_KEY:-}
  SHENGJI_R2_BUCKET_NAME: ${SHENGJI_R2_BUCKET_NAME:-shengji-share-audio}
  SHENGJI_DEPLOYMENT_REGION: cn
  SHENGJI_CLIENT_CONFIG_VERSION: 1
  SHENGJI_CLIENT_CONFIG_TTL_SECONDS: 3600
  SHENGJI_PUBLIC_API_BASE_URL: ${SHENGJI_PUBLIC_API_BASE_URL:-https://tone.cyberlab.bond/api/v1}
  SHENGJI_PUBLIC_SHARE_BASE_URL: ${SHENGJI_PUBLIC_SHARE_BASE_URL:-https://tone.cyberlab.bond}
  SHENGJI_PUBLIC_MEDIA_BASE_URL: ${SHENGJI_PUBLIC_MEDIA_BASE_URL:-https://tone.cyberlab.bond/api/v1}
  SHENGJI_CORS_ORIGINS: ${SHENGJI_CORS_ORIGINS:-https://tone.cyberlab.bond,http://localhost:5173,http://localhost:3000}
  SHENGJI_SHARE_RETENTION_DAYS: 7
  SHENGJI_SHARE_CLEANUP_INTERVAL_SECONDS: 3600
  SHENGJI_SHARE_UPLOAD_URL_TTL_SECONDS: 900
  SHENGJI_SHARE_DOWNLOAD_URL_TTL_SECONDS: 300

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shengji
      POSTGRES_USER: shengji
      POSTGRES_PASSWORD: ${SHENGJI_DATABASE_PASSWORD:-shengji-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shengji -d shengji"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shengji-db:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment: *server-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - ${SHENGJI_DATA_PATH:-./server/data}:/data

  share-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["python", "-m", "app.jobs.cleanup_expired_shares", "--watch"]
    environment: *server-environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${SHENGJI_DATA_PATH:-./server/data}:/data

volumes:
  shengji-db:
