x-server-environment: &server-environment
  SINGJOURNEY_DATABASE_URL: ${SINGJOURNEY_DATABASE_URL:-postgresql+psycopg://singjourney:singjourney-local-only@db:5432/singjourney}
  SINGJOURNEY_STORAGE_ROOT: ${SINGJOURNEY_STORAGE_ROOT:-/data/media}
  SINGJOURNEY_STORAGE_BACKEND: ${SINGJOURNEY_STORAGE_BACKEND:-local}
  SINGJOURNEY_R2_ACCOUNT_ID: ${SINGJOURNEY_R2_ACCOUNT_ID:-}
  SINGJOURNEY_R2_ACCESS_KEY_ID: ${SINGJOURNEY_R2_ACCESS_KEY_ID:-}
  SINGJOURNEY_R2_SECRET_ACCESS_KEY: ${SINGJOURNEY_R2_SECRET_ACCESS_KEY:-}
  SINGJOURNEY_R2_BUCKET_NAME: ${SINGJOURNEY_R2_BUCKET_NAME:-singjourney-share-audio}
  SINGJOURNEY_PUBLIC_API_BASE_URL: ${SINGJOURNEY_PUBLIC_API_BASE_URL:-https://singjourney.com/api/v1}
  SINGJOURNEY_PUBLIC_SHARE_BASE_URL: ${SINGJOURNEY_PUBLIC_SHARE_BASE_URL:-https://singjourney.com}
  SINGJOURNEY_CORS_ORIGINS: ${SINGJOURNEY_CORS_ORIGINS:-https://singjourney.com,http://localhost:5173,http://localhost:3000}
  SINGJOURNEY_SHARE_RETENTION_DAYS: 7
  SINGJOURNEY_SHARE_CLEANUP_INTERVAL_SECONDS: 3600
  SINGJOURNEY_SHARE_UPLOAD_URL_TTL_SECONDS: 900
  SINGJOURNEY_SHARE_DOWNLOAD_URL_TTL_SECONDS: 300
  SINGJOURNEY_WECHAT_PRACTICE_APP_ID: ${SINGJOURNEY_WECHAT_PRACTICE_APP_ID:-}
  SINGJOURNEY_WECHAT_PRACTICE_APP_SECRET: ${SINGJOURNEY_WECHAT_PRACTICE_APP_SECRET:-}
  SINGJOURNEY_AUTH_SESSION_DAYS: ${SINGJOURNEY_AUTH_SESSION_DAYS:-30}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: singjourney
      POSTGRES_USER: singjourney
      POSTGRES_PASSWORD: ${SINGJOURNEY_DATABASE_PASSWORD:-singjourney-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singjourney -d singjourney"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - singjourney-db:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment: *server-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - ${SINGJOURNEY_DATA_PATH:-./server/data}:/data

  share-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["python", "-m", "app.jobs.cleanup_expired_shares", "--watch"]
    environment: *server-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${SINGJOURNEY_DATA_PATH:-./server/data}:/data

volumes:
  singjourney-db:
