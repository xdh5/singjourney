server {
    listen 80;
    server_name _;

    # Bind the stable dist parent rather than dist/h5 itself. Client builds
    # replace the h5 directory atomically, which would otherwise invalidate
    # the container's bind mount after every rebuild.
    root /output/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
