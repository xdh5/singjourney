name: singjourney
services:
  practice-assets:
    build:
      context: ..
      dockerfile: docker/Dockerfile.practice-assets
  client-lint:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      target: quality
  client-format:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      target: quality
    command: npm run format -w @singjourney/client
    volumes:
      - ../client:/workspace/client
  client-build-wx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      target: wx-output
      args:
        MINI_PROGRAM_APP_ID: ${SINGJOURNEY_MINI_PROGRAM_APP_ID:-touristappid}
        API_BASE_URL: https://singjourney.com/api/v1
    volumes:
      - ../client/dist/mp-weixin:/output
  client-build-wx-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      target: wx-output
      args:
        MINI_PROGRAM_APP_ID: ${SINGJOURNEY_MINI_PROGRAM_APP_ID:-touristappid}
        API_BASE_URL: ${SINGJOURNEY_CLIENT_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
    volumes:
      - ../client/dist/mp-weixin:/output
